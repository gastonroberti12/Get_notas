<!-- Pestañas activos / dados de baja: se incluye en los listados de funciones, películas y servicios; recarga la misma página con o sin estado=inactivos -->
<div class="admin-actions admin-filtro">
    <a href="{{ url_for(request.endpoint) }}"   
       class="{{ 'admin-btn-secondary' if ver_inactivos else 'admin-btn-primary' }}">{{ etiqueta_activos }}</a>
    <a href="{{ url_for(request.endpoint, estado='inactivos') }}"
       class="{{ 'admin-btn-primary' if ver_inactivos else 'admin-btn-secondary' }}">{{ etiqueta_bajas }}</a>
</div>
