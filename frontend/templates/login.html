{% extends "base.html" %}

{% block title %}Ingresar{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/users.css') }}">
{% endblock %}

{% block content %}
<section class="section-login">
    <h1>Ingresar</h1>
    <p class="formulario_intro">Entrá a tu cuenta para comprar entradas.</p>

    {% if error %}
    <div class="formulario_alerta" role="alert">{{ error }}</div>
    {% endif %}

    <form method="post" action="{{ url_for('users.login') }}" class="formulario-login">
        <label class="formulario_campo">
            <span>Email *</span>
            <input type="email" name="email" required maxlength="150" autocomplete="email" value="{{ email or '' }}">
        </label>

        <label class="formulario_campo">
            <span>Contraseña *</span>
            <input type="password" name="password" required maxlength="128" autocomplete="current-password">
        </label>

        <div class="formulario_acciones">
            <button type="submit" class="boton">Ingresar</button>
        </div>
    </form>

    <p class="formulario_link">¿No tenés cuenta? <a href="{{ url_for('users.registro')}}">Registrate</a></p>
</section>
{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/users.js') }}"></script>
{% endblock %}
