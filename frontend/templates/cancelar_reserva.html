{% extends "base.html" %}

{% block title %}Cancelar reserva | Cine Paradiso{% endblock %}

{% block content %}
<div class="container d-flex flex-column justify-content-center align-items-center text-center"
     style="min-height: 60vh;">
    <h1 class="fw-bold mb-3">Cancelar reserva #{{ reserva_id }}</h1>
    <p class="fs-5 mb-4" style="color: var(--text-muted);">
        Solo se puede cancelar hasta 60 minutos antes de la función.<br>
        ¿Querés cancelar esta reserva?
    </p>
    <form method="post" action="{{ url_for('purchases.cancelar_reserva', reserva_id=reserva_id) }}"
          class="d-flex flex-wrap justify-content-center gap-3">
        <button type="submit" class="checkout-cancelar">Sí, cancelar reserva</button>
        <a href="{{ url_for('users.profile') }}" class="btn-gold">Volver al perfil</a>
    </form>
</div>
{% endblock %}
