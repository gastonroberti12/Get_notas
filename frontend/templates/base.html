<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Cine Paradiso{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header class="navbar">
        <a class="logo" href="{{ url_for('#') }}">Cine Paradiso</a>
        <nav>
            <a href="{{ url_for('#') }}">Películas</a>
            <a href="{{ url_for('#') }}">Cines</a>
            {% if session.get('usuario') %}
                <a href="{{ url_for('#') }}">{{ session['usuario']['nombre'] }}</a>
            {% else %}
                <a href="{{ url_for('#') }}">Ingresar</a>
            {% endif %}
        </nav>
    </header>

    <main>
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <span>Teléfono: 11-7676-7676</span>
        <span>Mail: cineparadiso@gmail.com</span>
    </footer>

    {% block scripts %}{% endblock %}
</body>
</html>
