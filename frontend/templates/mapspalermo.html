{% extends "base.html" %}

{% block title %}Mapa · Palermo{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/maps.css') }}">
{% endblock %}

{% block content %}
<section class="mapa-pagina">
    <header class="mapa-encabezado">
        <p class="mapa-etiqueta">CINE PARADISO</p>
        <h1>{{ sucursal_actual.nombre }}</h1>
        <p>{{ sucursal_actual.direccion }}</p>
    </header>
    <div class="mapa-marco">
        <iframe
            title="Mapa de Cine Paradiso {{ sucursal_actual.nombre }}"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2972.4802785998927!2d-58.412776324525545!3d-34.58651665658953!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcca821220477f%3A0x22f851827c26991e!2sCinemark%20Palermo!5e1!3m2!1ses-419!2sar!4v1794351686690!5m2!1ses-419!2sar" 
            width="100%"
            height="480"
            style="border:0;"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</section>
{% endblock %}
