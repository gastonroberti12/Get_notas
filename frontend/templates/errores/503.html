{% extends "base.html" %}

{% block content %}

<div class="error-pagina">

    <h1 class="error-codigo">503</h1>

    <h2 class="error-titulo">
        La función está en pausa
    </h2>

    <p class="error-texto">
        Nuestro servicio no se encuentra disponible en este momento.<br>
        Estamos trabajando para que puedas volver a disfrutar del cine.
    </p>

    <div class="error-acciones">
        <a href="{{ url_for('peliculas.inicio') }}" class="btn-gold">
            Volver al inicio
        </a>

        <a href="" class="btn-gold" onclick="window.location.reload(); return false;">
            Reintentar
        </a>
    </div>

</div>

{% endblock %}
