{% extends "base.html" %}

{% block title %}Mapa · Belgrano{% endblock %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/maps.css') }}">
{% endblock %}

{% block content %}
<section class="mapa-pagina">
    <header class="mapa-encabezado">
        <p class="mapa-etiqueta">CINE PARADISO</p>
        <h1>{{ sucursal_actual.nombre }}</h1>
        <p>{{ sucursal_actual.direccion }}</p>
    </header>
    <div class="mapa-marco">
        <iframe
            title="Mapa de Cine Paradiso {{ sucursal_actual.nombre }}"
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d11894.22883031673!2d-58.467474474007325!3d-34.55639922536786!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x95bcb42dc3d95ed9%3A0xbfcf33802627903c!2sCine%20Showcase%20Belgrano!5e1!3m2!1ses-419!2sar!4v1794351412196!5m2!1ses-419!2sar" 
            width="100%"
            height="480"
            style="border:0;"
            allowfullscreen
            loading="lazy"
            referrerpolicy="strict-origin-when-cross-origin"></iframe>
    </div>
</section>
{% endblock %}
