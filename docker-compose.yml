services:
  mysql:
    image: mysql:8.4
    container_name: mysql-cine-paradiso
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cine_paradiso}
      MYSQL_USER: ${DB_USER:-cine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cine_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/cine_paradiso.sql:/docker-entrypoint-initdb.d/01-cine_paradiso.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro

volumes:
  mysql_data:
