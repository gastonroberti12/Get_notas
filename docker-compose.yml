services:
  mysql:
    image: mysql:8.4
    container_name: mysql-cine-paradiso
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-cine_paradiso}
      MYSQL_USER: ${DB_USER:-cine}
      MYSQL_PASSWORD: ${DB_PASSWORD:-cine_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/cine_paradiso.sql:/docker-entrypoint-initdb.d/01-cine_paradiso.sql:ro
      - ./backend/db/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./backend
    container_name: cine-backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DB_HOST: mysql
    ports:
      - "${BACKEND_PORT:-5001}:5001"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5001/peliculas', timeout=3)"
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  frontend:
    build:
      context: ./frontend
    container_name: cine-frontend
    restart: unless-stopped
    env_file:
      - ./frontend/.env
    environment:
      BACKEND_URL: http://backend:5001
      FLASK_RUN_PORT: 5000
      FLASK_RUN_HOST: 0.0.0.0
    ports:
      - "${FRONTEND_PORT:-5000}:5000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mysql_data:
