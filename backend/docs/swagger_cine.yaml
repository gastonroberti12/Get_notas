openapi: 3.0.0
info:
  title: API de Cine Paradiso
  description: "API REST del sistema de venta de entradas de Cine Paradiso.\n\n- **Autenticación:**
    `POST /auth/login` devuelve un token que se envía en `Authorization: Bearer <token>`.
    Los endpoints sin candado son públicos.\n- **Fechas:** `date-time` en GMT-3 con
    6 decimales. Los importes son enteros en centavos.\n- **Errores:** siempre con
    el formato `{\"errors\": [...]}`.\n- **Paginación:** `_limit` y `_offset`, con
    enlaces HATEOAS en `_links`. Los listados vacíos responden 204.\n- **Roles:**
    Público general (sin cuenta), Cliente y Administrador. El backend valida rol y
    titularidad en cada endpoint."
  version: 1.0.0
servers:
- url: /
  description: Servidor local de desarrollo
tags:
- name: Autenticación
  description: Inicio y cierre de sesión
- name: Usuarios
  description: Registro, perfil e historial de usuarios
- name: Películas
  description: Cartelera, sincronizada con OMDb
- name: Funciones
  description: Proyecciones de una película en una sala y horario
- name: Sucursales
  description: Locales del cine
- name: Salas
  description: Salas de cada sucursal
- name: Butacas
  description: Asientos de cada sala
- name: Reservas
  description: 'Compra de entradas: reserva pendiente, pago y cancelación'
- name: Servicios
  description: Servicios adicionales (comida, bebida, estacionamiento) y su 
    compra en una reserva
- name: Entradas
  description: Entradas con QR y validación de ingreso
- name: Estadísticas
  description: Backoffice. `fecha_desde` y `fecha_hasta` filtran por fecha de la
    función (ocupación) o de la compra (ventas y cancelaciones)
paths:
  /usuarios:
    get:
      summary: Listar usuarios
      description: Listado paginado. Permite filtrar por rol y por nombre o 
        apellido (búsqueda parcial e insensible a mayúsculas). **Rol 
        autorizado:** Administrador.
      tags:
      - Usuarios
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/UsuarioRolFilter'
      - $ref: '#/components/parameters/NombreFilter'
      - $ref: '#/components/parameters/EmailFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetUsuariosList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Registrar un usuario cliente
      description: Crea un usuario con rol `cliente`. El email debe ser único. 
        **Rol autorizado:** Público general.
      tags:
      - Usuarios
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioCreate'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /usuarios/me:
    get:
      summary: Consultar el perfil propio
      description: '**Rol autorizado:** Cliente.'
      tags:
      - Usuarios
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GetUsuario200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /usuarios/me/reservas:
    get:
      summary: Listar las reservas propias
      description: '**Rol autorizado:** Cliente.'
      tags:
      - Usuarios
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ReservaEstadoFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetReservasList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /usuarios/me/entradas:
    get:
      summary: Listar las entradas propias
      description: El filtro `estado` es el de la reserva a la que pertenece cada
        entrada. **Rol autorizado:** Cliente.
      tags:
      - Usuarios
      security:
      - bearerAuth: []
      parameters:
      - $ref: '#/components/parameters/ReservaEstadoFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetEntradasList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /usuarios/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      summary: Obtener un usuario por ID
      description: '**Rol autorizado:** Administrador o titular.'
      tags:
      - Usuarios
      security:
      - bearerAuth: []
      responses:
        '200':
          $ref: '#/components/responses/GetUsuario200'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Actualizar parcialmente un usuario
      description: El titular puede modificar sus datos personales; el campo 
        `rol` solo lo modifica el Administrador. **Rol autorizado:** 
        Administrador o titular.
      tags:
      - Usuarios
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UsuarioUpdate'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/login:
    post:
      summary: Iniciar sesión
      description: 'Devuelve el token que se envía luego en `Authorization: Bearer
        <token>`. **Rol autorizado:** Público general.'
      tags:
      - Autenticación
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Credenciales'
      responses:
        '200':
          $ref: '#/components/responses/GetSesion200'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /auth/logout:
    post:
      summary: Cerrar sesión
      description: Cerrar sesión. **Rol autorizado:** Público general.
      tags:
      - Autenticación
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /peliculas:
    get:
      summary: Listar películas en cartelera
      description: Devuelve solo las películas activas y vigentes en cartelera. 
        **Rol autorizado:** Público general.
      tags:
      - Películas
      parameters:
      - $ref: '#/components/parameters/TituloFilter'
      - $ref: '#/components/parameters/GeneroFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetPeliculasList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Agregar una película a la cartelera
      description: El backend consulta OMDb con `id_externo` y guarda sus datos 
        (como `genero` se usa el primero que informa OMDb). 404 si OMDb no la 
        encuentra, 409 si ya existe y 502 si OMDb no responde. **Rol 
        autorizado:** Administrador.
      tags:
      - Películas
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaCreate'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
        '502':
          $ref: '#/components/responses/BadGateway'
  /peliculas/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      summary: Obtener una película por ID
      description: '**Rol autorizado:** Público general.'
      tags:
      - Películas
      responses:
        '200':
          $ref: '#/components/responses/GetPelicula200'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Actualizar parcialmente una película
      description: '**Rol autorizado:** Administrador.'
      tags:
      - Películas
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PeliculaUpdate'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Dar de baja una película
      description: 'Baja lógica: marca `activa` en false. **Rol autorizado:** Administrador.'
      tags:
      - Películas
      security:
      - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /funciones:
    get:
      summary: Listar funciones disponibles
      description: Devuelve solo funciones que todavía no comenzaron. **Rol 
        autorizado:** Público general.
      tags:
      - Funciones
      parameters:
      - $ref: '#/components/parameters/PeliculaIdFilter'
      - $ref: '#/components/parameters/SucursalIdFilter'
      - $ref: '#/components/parameters/SalaIdFilter'
      - $ref: '#/components/parameters/FechaFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetFuncionesList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Crear una función
      description: Valida que la película esté en cartelera y que la sala esté 
        libre, con media hora de margen entre funciones (409 si hay 
        superposición). **Rol autorizado:** Administrador.
      tags:
      - Funciones
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionCreate'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /funciones/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      summary: Obtener una función por ID
      description: '**Rol autorizado:** Público general.'
      tags:
      - Funciones
      responses:
        '200':
          $ref: '#/components/responses/GetFuncion200'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Actualizar parcialmente una función
      description: 409 si genera superposición de horarios o si la función ya 
        tiene reservas y se cambia sala o `fecha_hora`. **Rol autorizado:** 
        Administrador.
      tags:
      - Funciones
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FuncionUpdate'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Eliminar una función
      description: 409 si la función tiene reservas asociadas. **Rol 
        autorizado:** Administrador.
      tags:
      - Funciones
      security:
      - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /funciones/{id}/butacas:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      summary: Consultar butacas disponibles
      description: Devuelve únicamente las butacas disponibles para la función 
        consultada. La respuesta utiliza los campos de la tabla `butacas` (`id`,
        `sala_id`, `fila` y `numero`); la disponibilidad se refiere a esa 
        función y no es un estado persistente de la butaca. **Rol autorizado:** 
        Público general.
      tags:
      - Funciones
      responses:
        '200':
          $ref: '#/components/responses/GetButacasDisponibles200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sucursales:
    get:
      summary: Listar sucursales
      description: '**Rol autorizado:** Público general.'
      tags:
      - Sucursales
      parameters:
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetSucursalesList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Crear una sucursal
      description: '**Rol autorizado:** Administrador.'
      tags:
      - Sucursales
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SucursalCreate'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /sucursales/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      summary: Obtener una sucursal por ID
      description: '**Rol autorizado:** Público general.'
      tags:
      - Sucursales
      responses:
        '200':
          $ref: '#/components/responses/GetSucursal200'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Actualizar parcialmente una sucursal
      description: '**Rol autorizado:** Administrador.'
      tags:
      - Sucursales
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SucursalUpdate'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Eliminar una sucursal
      description: 409 si la sucursal tiene salas asociadas. **Rol autorizado:**
        Administrador.
      tags:
      - Sucursales
      security:
      - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /salas:
    get:
      summary: Listar salas
      description: '**Rol autorizado:** Público general.'
      tags:
      - Salas
      parameters:
      - $ref: '#/components/parameters/SucursalIdFilter'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          $ref: '#/components/responses/GetSalasList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Crear una sala
      description: 404 si la sucursal no existe. **Rol autorizado:** 
        Administrador.
      tags:
      - Salas
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaCreate'
      responses:
        '201':
          $ref: '#/components/responses/Created'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /salas/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      summary: Obtener una sala por ID
      description: '**Rol autorizado:** Público general.'
      tags:
      - Salas
      responses:
        '200':
          $ref: '#/components/responses/GetSala200'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    patch:
      summary: Actualizar parcialmente una sala
      description: '**Rol autorizado:** Administrador.'
      tags:
      - Salas
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SalaUpdate'
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      summary: Eliminar una sala
      description: 409 si la sala tiene butacas o funciones asociadas. **Rol 
        autorizado:** Administrador.
      tags:
      - Salas
      security:
      - bearerAuth: []
      responses:
        '204':
          $ref: '#/components/responses/NoContent'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /salas/{id}/butacas:
    parameters:
    - $ref: '#/components/parameters/Id'
    get:
      summary: Consultar las butacas de una sala
      description: Devuelve todas las butacas de la sala sin paginar, para poder
        dibujar el mapa de asientos. **Rol autorizado:** Público general.
      tags:
      - Butacas
      responses:
        '200':
          $ref: '#/components/responses/GetButacasList200'
        '204':
          $ref: '#/components/responses/NoContent'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      summary: Crear butacas para una sala
      description: Crea todas las butacas o ninguna. 409 si se supera la 
        `capacidad` de la sala o se repite una fila y número. **Rol 
        autorizado:** Administrador.
      tags:
      - Butacas
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ButacasCreate'
      responses:
        '201':
          $ref: '#/components/responses/CreatedMany'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'
  /butacas/{id}:
    parameters:
    - $ref: '#/components/parameters/Id'
    patch:
      summary: Actualizar parcialmente una butaca
      description: '**Rol autorizado:** Administrador.'
      tags:
