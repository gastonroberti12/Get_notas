  parameters:
    Id:
      name: id
      in: path
      required: true
      description: Identificador entero positivo del recurso
      schema:
        type: integer
      example: 1
    Limit:
      name: _limit
      in: query
      description: Cantidad máxima de registros por página
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
      example: 10
    Offset:
      name: _offset
      in: query
      description: Desplazamiento desde el primer registro
      schema:
        type: integer
        minimum: 0
        default: 0
      example: 0
    NombreFilter:
      name: nombre
      in: query
      description: Búsqueda parcial e insensible a mayúsculas por nombre
      schema:
        type: string
      example: Lucía
    EmailFilter:
      name: email
      in: query
      description: Búsqueda parcial e insensible a mayúsculas por email
      schema:
        type: string
        maxLength: 150
      example: lucia@
    TituloFilter:
      name: titulo
      in: query
      description: Búsqueda parcial e insensible a mayúsculas por título
      schema:
        type: string
      example: Incep
    GeneroFilter:
      name: genero
      in: query
      description: Filtrar por género
      schema:
        type: string
      example: Sci-Fi
    UsuarioRolFilter:
      name: rol
      in: query
      description: Filtrar por rol
      schema:
        type: string
        enum:
        - cliente
        - administrador
      example: cliente
    ActivoFilter:
      name: activo
      in: query
      description: Filtrar por indicador de activo
      schema:
        type: boolean
